services:
  - type: web
    name: synergy-drs
    runtime: python
    plan: starter
    buildCommand: >-
      pip install -r backend/requirements.txt -r datasets/requirements-training.txt
      && python datasets/prepare_signature_features.py
      && python -m backend.services.multi_dataset_xgboost_training
      && python datasets/compare_classical_holdout.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 backend.wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
